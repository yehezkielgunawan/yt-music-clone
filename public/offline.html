<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#111615" />
    <title>Yehezgun-music — Offline</title>
    <style>
      body {
        background: #111615;
        color: #f0efe5;
        font:
          16px/1.7 'Trebuchet MS',
          sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 420px;
        padding: 32px;
      }
      h1 {
        font:
          italic 44px Georgia,
          serif;
        color: #c9ed9b;
      }
      p {
        color: #9aaba1;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        background: #c9ed9b;
        color: #111615;
        border-radius: 5px;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #f0efe5;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" width="64" height="64" alt="Yehezgun-music" />
      <h1>A quiet moment.</h1>
      <p>
        You’re offline. YouTube needs a connection to play music. Your saved
        test queue is still on this device.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
